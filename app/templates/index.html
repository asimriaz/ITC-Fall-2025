<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

<h1 class="text-3xl font-bold mb-6 text-center">Country Management</h1>

<!-- Search Box -->
<div class="mb-6 flex justify-center">
    <input type="text" id="search" placeholder="Search country..." 
           class="border border-gray-400 p-2 rounded w-1/2"
           oninput="searchCountries()">
</div>

<div class="overflow-x-auto">
    <table class="table-auto w-full border border-gray-400 bg-white">
        <thead class="bg-gray-200 border-b border-gray-400">
            <tr>
                <th class="px-4 py-2 border-r border-gray-400">ID</th>
                <th class="px-4 py-2 border-r border-gray-400">Name</th>
                <th class="px-4 py-2">Status</th>
                <th class="px-4 py-2">Action</th>
            </tr>
        </thead>
        <tbody id="countryList" class="divide-y divide-gray-300"></tbody>
    </table>
</div>

<script>
    // Render countries into table
    function renderCountries(data) {
        let html = "";
        data.forEach(c => {
            html += `<tr>
                <td class="px-4 py-2 border-r border-gray-400">${c.countryid}</td>
                <td class="px-4 py-2 border-r border-gray-400">
                    <input type="text" id="name-${c.countryid}" value="${c.name}" 
                           class="border p-1 rounded w-full">
                </td>
                <td class="px-4 py-2">
                    <select id="status-${c.countryid}" class="border p-1 rounded w-full">
                        <option value="Visited" ${c.status === 'Visited' ? 'selected' : ''}>Visited</option>
                        <option value="Not Visited" ${c.status === 'Not Visited' ? 'selected' : ''}>Not Visited</option>
                    </select>
                </td>
                <td class="px-4 py-2">
                    <button onclick="saveCountry(${c.countryid})" 
                            class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
                        Save
                    </button>
                </td>
            </tr>`;
        });
        document.querySelector("#countryList").innerHTML = html;
    }

    // Fetch all countries
    function fetchCountries() {
        fetch("/api/countries")
            .then(res => res.json())
            .then(data => renderCountries(data));
    }

    // Search countries
    function searchCountries() {
        const term = document.querySelector("#search").value;
        if (term.length > 2) {
            fetch("/api/countries/search", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({name: term})
            })
            .then(res => res.json())
            .then(data => renderCountries(data));
        } else {
            fetchCountries();
        }
    }

    // Save a single country inline
    function saveCountry(id) {
        const updated = {
            countryid: id,
            name: document.querySelector(`#name-${id}`).value,
            status: document.querySelector(`#status-${id}`).value
        };

        fetch("/api/countries/save", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(updated)
        })
        .then(res => res.json())
        .then(() => fetchCountries());
    }

    // Initial load
    fetchCountries();
</script>

</body>
</html>
