<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
            margin: 0;
        }

        form {
            margin-bottom: 1rem;
        }

        input {
            padding: 0.4rem;
            font-size: 1rem;
        }

        button {
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
        }

        table,
        tr,
        tr td {
            border-collapse: collapse;
            padding: 5px;
        }

        td {
            border-bottom: 1px solid black;
        }

        table tr td:first-child {
            border-right: 1px solid black;
            text-align: right;
        }

        table tr:last-child td {
            border-bottom: none;
        }
        a:hover{
            color: blue;
            text-decoration: underline;
            
        }
        a{
            text-decoration: none;
            color: rgb(198, 198, 198);
        }

    </style>
    <script>
        function handleClick(e) {
            //alert(e.target.innerText);
            document.querySelector('input[name="LCM"]').value = e.target.innerText;
            document.querySelector('form').submit();
        }
    </script>
</head>

<body>
    <div style="display: flex; flex-wrap: wrap;">
        <div style="height: 96vh; overflow-y: auto; display: flex; flex-wrap: wrap; flex-direction: column; width: 800px; ">
            {% for num in range(1, 1001) %}
            <div style="width: 50px;"><a href="#!" onclick="handleClick(event)">{{ num }}</a></div>
            {% endfor %}
        </div>
        <div>
            <h1>LCM</h1>

            <form method="POST">
                <input name="LCM" placeholder="Enter a positive integer" value="{{ value|e }}">
            </form>


            {% if rows %}
            <table>
                {% for d, n in rows %}
                <tr>
                    <td>{{ d }}</td>
                    <td>{{ n }}</td>
                </tr>
                {% endfor %}
            </table>
            {% endif %}
        </div>

</body>

</html>
